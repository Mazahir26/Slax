name: Birthday reminders

on:
  schedule:
    # Run every hour. The endpoint only sends to users whose local midnight has
    # passed and records each delivery so hourly runs stay idempotent.
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: birthday-reminders
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trigger:
    name: Trigger reminder emails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/sendEmail
        env:
          SLAX_URL: ${{ secrets.SLAX_URL }}
          SLAX_CRON_KEY: ${{ secrets.SLAX_CRON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SLAX_URL}" ] || [ -z "${SLAX_CRON_KEY}" ]; then
            echo "::error::Set the SLAX_URL and SLAX_CRON_KEY repository secrets."
            exit 1
          fi

          # Build the JSON body without ever printing the key.
          payload="$(jq -cn --arg key "${SLAX_CRON_KEY}" '{key: $key}')"
          response_file="${RUNNER_TEMP}/slax-reminders-response.json"

          set +e
          http_code="$(curl --fail-with-body -sS \
            -o "${response_file}" \
            -w "%{http_code}" \
            -X POST "${SLAX_URL%/}/api/sendEmail" \
            -H "Content-Type: application/json" \
            --data "${payload}")"
          curl_status=$?
          set -e

          if [ -s "${response_file}" ]; then
            cat "${response_file}"
          fi

          # --fail-with-body already fails for 4xx/5xx; this also rejects
          # redirects and any other non-2xx response.
          if [ "${curl_status}" -ne 0 ] ||
            [ "${http_code}" -lt 200 ] ||
            [ "${http_code}" -ge 300 ]; then
            echo "::error::Reminder endpoint returned HTTP ${http_code} (curl exit ${curl_status})."
            exit 1
          fi
